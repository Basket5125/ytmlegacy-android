apply plugin: 'com.android.application'

android {
    namespace 'com.ytmlegacy.android'
    compileSdk 33

    defaultConfig {
        applicationId "com.ytmlegacy.android"
        minSdkVersion 9
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        // Vector icons are turned into PNGs at build time for Android < 5.
        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']
        ndk {
            // Conscrypt ships no armeabi (ARMv6) build; those phones fall back to the system TLS.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the local debug key so the APK installs straight away; replace with
            // your own release key before publishing.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        error 'NewApi'
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'GradleDependency', 'SetTextI18n',
                'IconMissingDensityFolder', 'IconDensities', 'UnusedResources', 'ObsoleteSdkInt'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
